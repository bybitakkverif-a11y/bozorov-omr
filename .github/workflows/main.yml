name: Build Bozorov OMR APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.24.1

      - name: Build Android APK
        run: |
          flet build apk --project "Bozorov OMR" --description "Bozorov Math Milliy Sertifikat Skaneri" --org "uz.bozorovmath"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bozorov-OMR-APK
          path: build/apk/*.apk
